{% extends "usernav.html" %} {% load static %} {% block content %}
<style>
  :root {
    --teal: #20c997;
    --dark-teal: #1aa179;
    --amber: #ffc107;
    --dark-amber: #e0a800;
    --text-dark: #2b2d42;
    --text-light: #6c757d;
    --bg-light: #f8f9fa;
    --card-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
  }

  .edit-profile-container {
    max-width: 600px;
    margin: 2.5rem auto;
    padding: 2rem;
    background: white;
    border-radius: 16px;
    box-shadow: var(--card-shadow);
    animation: fadeIn 0.6s ease-in-out;
  }

  .edit-profile-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .edit-profile-header h2 {
    color: var(--teal);
    font-weight: 700;
    position: relative;
    display: inline-block;
  }

  .edit-profile-header h2::after {
    content: "";
    position: absolute;
    width: 60px;
    height: 4px;
    background: var(--amber);
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 4px;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-label {
    font-weight: 600;
    color: var(--text-dark);
    font-size: 1.1rem;
  }

  .form-control {
    border-radius: 8px;
    padding: 0.75rem;
    border: 1px solid #ced4da;
    transition: border-color 0.3s ease;
  }

  .form-control:focus {
    border-color: var(--teal);
    box-shadow: 0 0 8px rgba(32, 201, 151, 0.2);
  }

  .preview-img {
    max-width: 150px;
    border-radius: 10px;
    margin-top: 1rem;
  }

  .btn-submit {
    background: var(--teal);
    border: none;
    padding: 0.9rem 2.5rem;
    font-weight: 600;
    color: white;
    border-radius: 50px;
    transition: all 0.3s ease;
    width: 100%;
  }

  .btn-submit:hover {
    background: var(--dark-teal);
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(32, 201, 151, 0.3);
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @media (max-width: 768px) {
    .edit-profile-container {
      margin: 1.5rem;
      padding: 1.5rem;
    }
  }
</style>

<div class="edit-profile-container">
  <div class="edit-profile-header">
    <h2>Edit Profile</h2>
  </div>

  {% if messages %} {% for message in messages %}
  <div
    class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3"
    role="alert"
  >
    {{ message }}
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close"
    ></button>
  </div>
  {% endfor %} {% endif %}

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
      <label for="username" class="form-label">Username</label>
      <input
        type="text"
        class="form-control"
        id="username"
        name="username"
        value="{{ user.username }}"
        required
      />
    </div>
    <div class="form-group">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        value="{{ user.email }}"
        required
      />
    </div>
    <div class="form-group">
      <label for="profile_picture" class="form-label">Profile Picture</label>
      <input
        type="file"
        class="form-control"
        id="profile_picture"
        name="profile_picture"
        accept="image/jpeg,image/png"
      />
      {% if user.profile_picture %}
      <img
        src="{{ user.profile_picture.url }}"
        alt="Profile Picture"
        class="preview-img"
      />
      {% endif %}
    </div>
    <button type="submit" class="btn btn-submit">Save Changes</button>
  </form>
</div>
{% endblock %}
