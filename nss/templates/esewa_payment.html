{% extends "usernav.html" %} {% load static %} {% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
          <h3 class="mb-0"><i class="fas me-2"></i>Complete Your Purchase</h3>
        </div>
        <div class="card-body">
          <div class="text-center mb-4">
            <i class="fas fa-shopping-cart fa-3x text-primary mb-3"></i>
            <h4>Note: {{ data.note_title }}</h4>
            <h3 class="text-success">Rs. {{ data.amount }}</h3>
          </div>

          <form
            action="https://rc-epay.esewa.com.np/api/epay/main/v2/form"
            method="POST"
          >
            <input type="hidden" name="amount" value="{{ data.amount }}" />
            <input
              type="hidden"
              name="tax_amount"
              value="{{ data.tax_amount }}"
            />
            <input
              type="hidden"
              name="total_amount"
              value="{{ data.total_amount }}"
            />
            <input
              type="hidden"
              name="transaction_uuid"
              value="{{ data.transaction_uuid }}"
            />
            <input
              type="hidden"
              name="product_code"
              value="{{ data.product_code }}"
            />
            <input
              type="hidden"
              name="product_service_charge"
              value="{{ data.product_service_charge }}"
            />
            <input
              type="hidden"
              name="product_delivery_charge"
              value="{{ data.product_delivery_charge }}"
            />
            <input
              type="hidden"
              name="success_url"
              value="{{ data.success_url }}"
            />
            <input
              type="hidden"
              name="failure_url"
              value="{{ data.failure_url }}"
            />
            <input
              type="hidden"
              name="signed_field_names"
              value="{{ data.signed_field_names }}"
            />
            <input
              type="hidden"
              name="signature"
              value="{{ data.signature }}"
            />

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fas fa-credit-card me-2"></i> e-Sewa
              </button>
              <a
                href="{% url 'exclusive_notes_list' %}"
                class="btn btn-secondary"
              >
                <i class="fas fa-arrow-left me-2"></i>Cancel
              </a>
            </div>
          </form>

          <div class="mt-4 p-3 bg-light rounded">
            <small class="text-muted">
              <i class="fas fa-info-circle me-1"></i>
              You will be redirected to eSewa to complete your payment securely.
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
