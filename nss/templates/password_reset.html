{% extends "app.html" %} {% load static %} {% block content %}

<div class="row justify-content-center my-5">
  <div class="login-card col-md-5 col-lg-4">
    <h2 class="text-center mb-4 text-secondary">Reset Password</h2>

    <p class="text-muted text-center mb-4">
      Enter your email address below, and we’ll send you a link to reset your
      password.
    </p>

    <form method="POST">
      {% csrf_token %} {{ form.email.label_tag }}
      <input
        type="email"
        name="{{ form.email.name }}"
        class="form-control mb-3"
        placeholder="Enter your email"
        required
      />
      <button type="submit" class="btn btn-dark w-100 fw-bold">
        Send Reset Link
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="{% url 'login' %}" class="btn btn-outline-dark px-4"
        >Back to Login</a
      >
    </div>
  </div>
</div>

{% endblock content %}
